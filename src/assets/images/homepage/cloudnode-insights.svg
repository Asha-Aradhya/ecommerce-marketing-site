<svg viewBox="0 0 720 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloudnode Insights analytics dashboard">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7100" stop-opacity="0.28" />
      <stop offset="1" stop-color="#FF7100" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#063B67" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Decorative brand blobs -->
  <circle cx="636" cy="86" r="120" fill="#FFBE8B" opacity="0.22" />
  <circle cx="92" cy="520" r="120" fill="#A2DDFB" opacity="0.30" />

  <!-- Dashboard card -->
  <rect x="60" y="100" width="600" height="400" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />

  <!-- Header: cloud mark + spark + title -->
  <g transform="translate(92 122)">
    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96Z" fill="#142E56" />
  </g>
  <path d="M118 116c.5 3.4 1.5 4.4 4.9 4.9-3.4.5-4.4 1.5-4.9 4.9-.5-3.4-1.5-4.4-4.9-4.9 3.4-.5 4.4-1.5 4.9-4.9Z" fill="#FF7100" />
  <text x="150" y="145" font-family="Montserrat, ui-sans-serif, sans-serif" font-size="26" font-weight="700" fill="#063B67">Cloudnode Insights</text>

  <!-- Window dots -->
  <circle cx="600" cy="135" r="6" fill="#FF7100" />
  <circle cx="620" cy="135" r="6" fill="#A2DDFB" />
  <circle cx="640" cy="135" r="6" fill="#142E56" opacity="0.25" />

  <!-- Divider -->
  <line x1="92" y1="172" x2="628" y2="172" stroke="#E5EAF1" stroke-width="2" />

  <!-- Chart gridlines -->
  <g stroke="#EEF2F7" stroke-width="2">
    <line x1="96" y1="220" x2="624" y2="220" />
    <line x1="96" y1="270" x2="624" y2="270" />
    <line x1="96" y1="320" x2="624" y2="320" />
    <line x1="96" y1="370" x2="624" y2="370" />
  </g>

  <!-- Trend area + line -->
  <path d="M96 360 L170 330 L244 344 L318 288 L392 300 L466 250 L540 232 L624 200 L624 400 L96 400 Z" fill="url(#area)" />
  <polyline points="96,360 170,330 244,344 318,288 392,300 466,250 540,232 624,200" fill="none" stroke="#FF7100" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data points -->
  <g fill="#FF7100" stroke="#FFFFFF" stroke-width="3">
    <circle cx="170" cy="330" r="5.5" />
    <circle cx="318" cy="288" r="5.5" />
    <circle cx="466" cy="250" r="5.5" />
    <circle cx="624" cy="200" r="7" fill="#063B67" />
  </g>

  <!-- Baseline -->
  <line x1="96" y1="400" x2="624" y2="400" stroke="#D8E0EA" stroke-width="2" />

  <!-- Stat tiles -->
  <g>
    <rect x="96" y="426" width="166" height="58" rx="12" fill="#F4F7FB" />
    <rect x="112" y="442" width="70" height="9" rx="4.5" fill="#C6D2E0" />
    <rect x="112" y="459" width="110" height="11" rx="5.5" fill="#142E56" />

    <rect x="277" y="426" width="166" height="58" rx="12" fill="#F4F7FB" />
    <rect x="293" y="442" width="70" height="9" rx="4.5" fill="#C6D2E0" />
    <rect x="293" y="459" width="90" height="11" rx="5.5" fill="#FF7100" />

    <rect x="458" y="426" width="166" height="58" rx="12" fill="#F4F7FB" />
    <rect x="474" y="442" width="70" height="9" rx="4.5" fill="#C6D2E0" />
    <rect x="474" y="459" width="100" height="11" rx="5.5" fill="#063B67" />
  </g>
</svg>
